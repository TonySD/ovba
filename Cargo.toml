[package]
name = "ovba-tonysd-fork"
version = "0.7.1"
authors = ["Tim Weis <tim.weis@outlook.com>", "TonySD <whoami.ctf@yandex.ru>"]
description = "An Office VBA project parser written in 100% safe Rust. Added ability writing source code."
edition = "2018"
exclude = [".gitignore", "docs/dev/**", ".github/**"]
license-file = "LICENSE"
repository = "https://github.com/TonySD/ovba"
documentation = "https://docs.rs/ovba"
readme = "README.md"
keywords = ["parser", "office", "vba"]
categories = ["parser-implementations"]

[dependencies]
cfb = "0.10"
codepage = "0.1"
encoding_rs = "0.8"
nom = { version = "7.1", default-features = false }
colog = "0.1"
log = "0.4"
